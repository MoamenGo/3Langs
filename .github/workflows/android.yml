name: Android APK

on:
  push:
    branches: [main, claude/project-thread-5c37ht]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Use the release key if one is set up
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/3Lang.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 3Lang-apk
          path: ${{ runner.temp }}/3Lang.apk

      - name: Publish as the "android-latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: 3Lang for Android (latest build)
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/3Lang.apk
          body: |
            Open this page on your Android phone, tap **3Lang.apk** to download it, then open the file and allow installing from your browser if asked.
            Built from ${{ github.sha }} (build ${{ github.run_number }}).
