name: Android APK

on:
  push:
    branches: [main, claude/project-thread-5c37ht, claude/project-thread-1sfuxr]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # The 3Lang key lives in app/android/signing so every build is signed
      # the same way and updates install over the app. Repository secrets, if
      # added later, take priority.
      - name: Pick the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/android/signing/3lang-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=wrjip7Uthr6h9YDWRo3hqa4L"
              echo "ANDROID_KEY_ALIAS=3lang"
              echo "ANDROID_KEY_PASSWORD=wrjip7Uthr6h9YDWRo3hqa4L"
            } >> "$GITHUB_ENV"
          fi
          echo "Signing with alias: $(grep ANDROID_KEY_ALIAS "$GITHUB_ENV" | cut -d= -f2)"

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/3Lang.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Signer of the APK (build-tools: $BT):"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/3Lang.apk" 2>&1 | head -8 || true

      - uses: actions/upload-artifact@v4
        with:
          name: 3Lang-apk
          path: ${{ runner.temp }}/3Lang.apk

      - name: Publish as the "android-latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: 3Lang for Android (latest build)
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/3Lang.apk
          body: |
            Open this page on your Android phone, tap **3Lang.apk** to download it, then open the file and allow installing from your browser if asked.
            Built from ${{ github.sha }} (build ${{ github.run_number }}).
